name: NetLink Windows
on:
  workflow_dispatch:
  push:
    branches: ['codex/school-*']
permissions:
  contents: read
concurrency:
  group: school-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-base mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-openssl mingw-w64-x86_64-lzo2
            mingw-w64-x86_64-libjpeg-turbo mingw-w64-x86_64-libpng mingw-w64-x86_64-zlib
            mingw-w64-x86_64-nsis
      - name: Install verified legacy build libraries
        shell: msys2 {0}
        run: bash .github/scripts/install-school-build-libraries.sh
      - name: Prepare pinned Qt with KDE patches
        shell: pwsh
        run: ./packaging/prepare-qt51519.ps1 -MsysRoot '${{ steps.msys2.outputs.msys2-location }}'
      - name: Configure and build
        shell: msys2 {0}
        run: |
          toolchain="$(cygpath -m /mingw64)"
          qt_prefix="$(cygpath -m "$PWD/build-qt51519/mingw64")"
          export PATH="$PWD/build-qt51519/mingw64/bin:$PATH"
          cmake -S . -B build-school -G Ninja -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=x86_64 -DCMAKE_PREFIX_PATH="$qt_prefix;$toolchain" -DWITH_BUILTIN_LIBVNC=ON -DWITH_TESTS=ON -DWITH_PCH=OFF -DWITH_UNITY_BUILD=OFF -DWITH_LTO=OFF -DWITH_TRANSLATIONS=OFF -DWITH_INTERCEPTION=OFF -DCMAKE_BUILD_TYPE=Release -DMINGW_PREFIX="$toolchain" -DMINGW_PLATFORM=win64 -DMINGW_TARGET=x86_64-w64-mingw32
          cmake --build build-school -j 4
      - name: Unit tests
        shell: msys2 {0}
        run: |
          export PATH="$PWD/build-school/core:$PWD/build-qt51519/mingw64/bin:$PATH"
          export QT_QPA_FONTDIR="$(cygpath -m "$SYSTEMROOT")/Fonts"
          export VEYON_SCHOOL_SCHEMA_FIXTURES="$(cygpath -w "$PWD/build-school/schema-fixtures")"
          test_status=0
          ctest --test-dir build-school --output-on-failure || test_status=$?
          if [ "$test_status" -eq 0 ]; then
            ctest --test-dir build-school --output-on-failure -R '^netlink-socket-write-tests$' --repeat until-fail:20 || test_status=$?
          fi
          # Qt writes details to files. Preserve failures instead of exiting
          # before their diagnostics reach the GitHub log.
          for result_file in build-school/tests/*-results.txt; do
            if [ -f "$result_file" ]; then cat "$result_file"; fi
          done
          exit "$test_status"
      - name: Official XML schema validation
        shell: pwsh
        run: ./tests/validate-discovery.ps1 -Fixtures build-school/schema-fixtures
      - name: Production build
        shell: msys2 {0}
        run: |
          toolchain="$(cygpath -m /mingw64)"
          qt_prefix="$(cygpath -m "$PWD/build-qt51519/mingw64")"
          export PATH="$PWD/build-qt51519/mingw64/bin:$PATH"
          cmake -S . -B build-release -G Ninja -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=x86_64 -DCMAKE_PREFIX_PATH="$qt_prefix;$toolchain" -DWITH_BUILTIN_LIBVNC=ON -DWITH_TESTS=OFF -DWITH_PCH=OFF -DWITH_UNITY_BUILD=OFF -DWITH_LTO=OFF -DWITH_TRANSLATIONS=OFF -DWITH_INTERCEPTION=OFF -DCMAKE_BUILD_TYPE=Release -DMINGW_PREFIX="$toolchain" -DMINGW_PLATFORM=win64 -DMINGW_TARGET=x86_64-w64-mingw32
          cmake --build build-release -j 4
      - name: Package
        shell: pwsh
        run: |
          $toolchain=Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'mingw64'
          $qtPrefix=Join-Path $pwd 'build-qt51519/mingw64'
          $env:PATH=(Join-Path $qtPrefix 'bin')+';'+(Join-Path $toolchain 'bin')+';'+$env:PATH
          ./packaging/build-package.ps1 -Build build-release -Toolchain $toolchain -QtPrefix $qtPrefix
          ./packaging/verify-package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: installer
          path: |
            dist/*setup.exe
            dist/package-manifest.json
          retention-days: 1
          if-no-files-found: error
